[pytest]
# The translator modules use flat imports (`import config`, `from util import ...`),
# exactly as when run via `python3 ops_translator/__main__.py`. Putting the inner
# package directory on sys.path lets tests import them the same way.
pythonpath = ops_translator
testpaths = tests
addopts = -ra
markers =
    clang: tests that need libclang to parse C++ snippets